server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The catalogues are ~2.2 MB of JSON; gzip takes them to a fraction of that.
  gzip on;
  gzip_types application/json application/javascript text/css text/html;
  gzip_min_length 1024;
  gzip_vary on;

  # The data and the bundle are versioned by the release, not by filename, so
  # they get a day of caching rather than a year — long enough to matter, short
  # enough that a redeploy is visible the next day without a hard refresh.
  location ~* \.(json|js|css)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
