<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><title>képdiff</title></head><body>
<script>
/* Két PNG pixelenkénti összevetése. A böngészőben fut, mert a rajzolás is ott
 * történt — ugyanaz a dekóder, nincs színtér-eltérés. */
window.diff = function (aUrl, bUrl) {
  return Promise.all([aUrl, bUrl].map(function (u) {
    return new Promise(function (ok, hiba) {
      var i = new Image(); i.onload = function () { ok(i); }; i.onerror = hiba; i.src = u;
    });
  })).then(function (kepek) {
    var a = kepek[0], b = kepek[1];
    if (a.width !== b.width || a.height !== b.height) {
      return { hiba: "eltérő méret: " + a.width + "x" + a.height + " vs " + b.width + "x" + b.height };
    }
    var cv = document.createElement("canvas");
    cv.width = a.width; cv.height = a.height;
    var cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(a, 0, 0); var da = cx.getImageData(0, 0, cv.width, cv.height).data;
    cx.clearRect(0, 0, cv.width, cv.height);
    cx.drawImage(b, 0, 0); var db = cx.getImageData(0, 0, cv.width, cv.height).data;

    var elteroPixel = 0, osszeg = 0, max = 0, hisztogram = { "1-8": 0, "9-32": 0, "33-96": 0, "97+": 0 };
    var diffCv = document.createElement("canvas");
    diffCv.width = cv.width; diffCv.height = cv.height;
    var dcx = diffCv.getContext("2d");
    var kim = dcx.createImageData(cv.width, cv.height);
    for (var i = 0; i < da.length; i += 4) {
      var d = Math.max(Math.abs(da[i]-db[i]), Math.abs(da[i+1]-db[i+1]), Math.abs(da[i+2]-db[i+2]));
      if (d > 0) {
        elteroPixel++; osszeg += d; if (d > max) max = d;
        if (d <= 8) hisztogram["1-8"]++; else if (d <= 32) hisztogram["9-32"]++;
        else if (d <= 96) hisztogram["33-96"]++; else hisztogram["97+"]++;
      }
      // a diffkép: fekete alap, az eltérés vörösen felnagyítva
      kim.data[i] = Math.min(255, d * 4); kim.data[i+1] = 0; kim.data[i+2] = 0; kim.data[i+3] = 255;
    }
    dcx.putImageData(kim, 0, 0);
    window.__diffPng = diffCv.toDataURL("image/png").split(",")[1];
    return {
      pixel: cv.width * cv.height,
      eltero: elteroPixel,
      arany: +(100 * elteroPixel / (cv.width * cv.height)).toFixed(3),
      atlagEltres: elteroPixel ? +(osszeg / elteroPixel).toFixed(1) : 0,
      maxEltres: max,
      hisztogram: hisztogram
    };
  });
};
</script>
</body></html>
