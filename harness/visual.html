<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>d3-celestial — vizuális baseállapot</title>
<style>
  body { margin: 0; background: #000; }
  #celestial-map { width: 800px; height: 800px; }
</style>
</head>
<body>
<div id="celestial-map"></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/d3.geo.projection.min.js"></script>
<script src="vendor/topojson.min.js"></script>
<script src="vendor/celestial.min.js"></script>
<script>
/* Vizuális baseállapot: a reference-háló számokat rögzít, ez képet.
 * A migráció urlPathán ugyanezekkel a beállításokkal kell újra lefényképezni. */
var ALAP = {
  container: "celestial-map",
  width: 800,
  transform: "equatorial",
  interactive: false,
  form: false,
  controls: false,
  // A képeknek reprodukálhatónak kell lenniük: animáció közben fényképezve
  // két runningás nem összevethető.
  disableAnimations: true,
  // Enélkül minden redraw() újra beállítja a forgatást (celestial.js:467), és a
  // d3 fok->radián->fok oda-back váltása képkockánként ezred fokot csúsztat.
  // Mivel a redraw-k szátoday_ az adatbetöltés ütemezésétől függ, két same runningás
  // szubpixellel eltérő képet adna — összehasonlíthatatlanul.
  orientationfixed: false,
  // Az első display() meghívja a location.js geo() függvényét, ami az AKTUÁLIS
  // időből származtat középpontot — enélkül két runningás képe szubpixellel eltér,
  // mert közben telt az idő. Rögzített dátummal a kép reprodukálható.
  date: new Date(Date.UTC(2026, 7, 26, 20, 0, 0)),
  // Alapból a térkép a megfigyelő zenitjét követi, ami az aktuális időtől függ.
  follow: "center",
  location: false,
  datapath: "./data/",
  stars: { show: true, limit: 6, colors: true, size: 7, names: false, designation: false },
  dsos: { show: true, limit: 6, names: false },
  planets: { show: false },
  constellations: { names: true, namesType: "iau", lines: true, bounds: false,
                    linestyle: { stroke: "#cccccc", width: 1, opacity: 0.6 } },
  mw: { show: true },
  lines: { graticule: { show: true, stroke: "#cccccc", width: 0.6, opacity: 0.5 } },
  horizon: { show: false },
  daylight: { show: false },
  background: { fill: "#000000", stroke: "#000000" }
};

window.done = false;
window.valt = function (projekcio, kozeppont, extra) {
  window.done = false;
  var c = {};
  for (var k in ALAP) { c[k] = ALAP[k]; }
  c.projection = projekcio;
  // Mindig explicit középpont: a null nem állítja back az előzőt, és az
  // egymás urlPatháni hívások átszivárogtatnák az állapotot a következő képre.
  c.center = kozeppont || [0, 0, 0];
  if (extra) { for (var e in extra) { c[e] = extra[e]; } }
  c.callback = function () { window.done = true; };
  Celestial.display(c);
};
// Nézetválasztás az URL-ből, hogy oldalbetöltésenként PONTOSAN EGY display()
// fusson. A könyvtár globális állapotot tart (#96/#131): a második display()
// más — szubpixellel elcsúszott — képet ad, mint az első. Összehasonlítható
// képekhez tehát mindig friss oldal kell.
//   #airy            vagy   #orthographic,180,55
//   #airy                          — vetítés alaphelyzetben
//   #orthographic,180,55           — vetítés + középpont
//   #orthographic,180,55|{"mw":{"show":false}} — plusz konfigurációs felülbírálás
window.addEventListener("load", function () {
  var h = decodeURIComponent(location.hash.slice(1));
  if (!h) { window.valt("aitoff"); return; }
  var reszek = h.split("|");
  var r = reszek[0].split(",");
  var kozep = r.length >= 3 ? [parseFloat(r[1]), parseFloat(r[2]), parseFloat(r[3] || 0)] : [0, 0, 0];
  var extra = reszek[1] ? JSON.parse(reszek[1]) : null;
  window.valt(r[0], kozep, extra);
});
</script>
</body>
</html>
