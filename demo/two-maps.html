<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>d3-celestial — two independent maps</title>
<style>
  body { font: 14px sans-serif; margin: 16px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .box { border: 1px solid #ddd; padding: 8px; border-radius: 6px; }
  h2 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
  #statusEl { margin-top: 12px; font: 12px monospace; white-space: pre-wrap; background: #f4f4f4; padding: 8px; }
</style>
</head>
<body>
<h1>Two independent maps on one page</h1>
<p>
  Upstream issues #96 and #131: the library kept global state, so only one map worked on a
  page. With the class-based interface every instance gets its own state.
</p>
<div class="row">
  <div class="box"><h2>A — orthographic, Ursa Major</h2><div id="terkep-a"></div></div>
  <div class="box"><h2>B — mollweide, whole sky</h2><div id="terkep-b"></div></div>
</div>
<div id="statusEl">Loading…</div>

<script type="module">
import { SkyMap } from "../build/celestial.mjs";

const COMMON = {
  width: 470,
  datapath: "../harness/data/",
  interactive: false, form: false, controls: false, location: false,
  follow: "center", disableAnimations: true, orientationfixed: false,
  date: new Date(Date.UTC(2026, 7, 26, 20, 0, 0)),
  stars: { limit: 5, colors: true, names: false, designation: false },
  dsos: { show: true, limit: 5, names: false },
  planets: { show: false },
  constellations: { names: true, namesType: "iau", lines: true, bounds: false },
  mw: { show: true },
  lines: { graticule: { show: true } },
  horizon: { show: false }, daylight: { show: false },
  background: { fill: "#000000", stroke: "#000000" }
};

// `standalone: true` is the point: the instance builds only on the defaults and on
// its own config, not on the accumulated global settings.
const a = new SkyMap(Object.assign({}, COMMON, {
  container: "terkep-a", projection: "orthographic", center: [180, 55, 0]
}), { standalone: true });

const b = new SkyMap(Object.assign({}, COMMON, {
  container: "terkep-b", projection: "mollweide", center: [0, 0, 0]
}), { standalone: true });

window.__a = a; window.__b = b;

setTimeout(function () {
  document.getElementById("statusEl").textContent =
    "A: " + a.cfg.projection + "  centre " + JSON.stringify(a.cfg.center.map(Math.round)) +
      "  scale " + Math.round(a.mapProjection.scale()) + "\n" +
    "B: " + b.cfg.projection + "  centre " + JSON.stringify(b.cfg.center.map(Math.round)) +
      "  scale " + Math.round(b.mapProjection.scale()) + "\n" +
    "separate state: " + (a.cfg !== b.cfg) + " · separate projection: " + (a.mapProjection !== b.mapProjection) +
      " · separate container: " + (a.container.node() !== b.container.node());
}, 4000);
</script>
</body>
</html>
